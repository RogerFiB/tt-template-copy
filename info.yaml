# Tiny Tapeout project information (Wokwi project)
project:
  # wokwi_id: "479020979884889089" # Set this to the ID of your Wokwi project (the number from the project's URL)
  title: "Tiny Tapeout Template Copy" # Project title
  author: "Roger" # Your name
  discord: "" # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description: "just_to_test" # One line description of what your project does
  language: "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  top_module: "tt_um_dvfs_top_controller"
  source_files:
      - "src/dvfs_rtl/dvfs_decoder.sv"
      - "src/dvfs_rtl/dvfs_pkg.sv"
      - "src/dvfs_rtl/dvfs_pll_model.sv"
      - "src/dvfs_rtl/dvfs_pss_model.sv"
      - "src/dvfs_rtl/dvfs_top_controller.sv"
      - "src/dvfs_rtl/dvfs_transition_ctrl.sv"
      - "src/dvfs_rtl/dvfs_vf_checker.sv"
  clock_hz: 1000 # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1" # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

